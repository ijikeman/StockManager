<div>
  <div class="page-header">
    <h1 class="page-title">優待履歴</h1>
    <div>
      <button @click="goToAddBenefit" class="btn btn-primary">新規登録</button>
    </div>
  </div>

  <table class="common-table" v-if="benefits.length > 0">
    <thead>
      <tr>
        <th @click="sortBy('paymentDate')" class="sortable">
          日付
          <span v-if="sortKey === 'paymentDate'">
            <span v-if="sortOrders['paymentDate'] > 0">▲</span>
            <span v-else>▼</span>
          </span>
        </th>
        <th>銘柄名</th>
        <th>優待金</th>
        <th>アクション</th>
      </tr>
    </thead>
    <tbody>
      <tr v-for="benefit in sortedBenefits" :key="benefit.id">
        <td>{{ benefit.paymentDate }}</td>
        <td>
          <span v-if="benefit.stockLot">{{ benefit.stockLot.stock?.name }}</span>
          <span v-else-if="benefit.sellTransaction">{{ benefit.sellTransaction.buyTransaction?.stockLot?.stock?.name }}</span>
        </td>
        <td>{{ fmt(benefit.benefit) }}</td>
        <td>
          <button @click="editBenefit(benefit.id)" class="btn btn-secondary">編集</button>
          <button @click="deleteBenefit(benefit.id)" class="btn btn-danger">削除</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div v-else>
    <p>データはありません</p>
  </div>
</div>
